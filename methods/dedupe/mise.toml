[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the dedupe tests"
run = "deno test dedupe.test.ts"

[tasks.bench]
description = "Benchmark dedupe"
run = "deno bench dedupe.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check dedupe.ts dedupe.test.ts dedupe.bench.ts"

[tasks.lint]
description = "Lint the dedupe sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the dedupe sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
