[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test quickSelect.test.ts"
[tasks.bench]
run = "deno bench quickSelect.bench.ts"
[tasks.check]
run = "deno check quickSelect.ts quickSelect.test.ts quickSelect.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
