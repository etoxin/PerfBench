[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test parseSemver.test.ts"
[tasks.bench]
run = "deno bench parseSemver.bench.ts"
[tasks.check]
run = "deno check parseSemver.ts parseSemver.test.ts parseSemver.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
