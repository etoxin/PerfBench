[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test mergeSort.test.ts"
[tasks.bench]
run = "deno bench mergeSort.bench.ts"
[tasks.check]
run = "deno check mergeSort.ts mergeSort.test.ts mergeSort.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
