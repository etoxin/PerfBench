[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test groupAnagrams.test.ts"
[tasks.bench]
run = "deno bench groupAnagrams.bench.ts"
[tasks.check]
run = "deno check groupAnagrams.ts groupAnagrams.test.ts groupAnagrams.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
