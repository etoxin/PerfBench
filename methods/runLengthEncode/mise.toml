[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test runLengthEncode.test.ts"
[tasks.bench]
run = "deno bench runLengthEncode.bench.ts"
[tasks.check]
run = "deno check runLengthEncode.ts runLengthEncode.test.ts runLengthEncode.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
