[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test quickSort.test.ts"
[tasks.bench]
run = "deno bench quickSort.bench.ts"
[tasks.check]
run = "deno check quickSort.ts quickSort.test.ts quickSort.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
