[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test nearestValue.test.ts"
[tasks.bench]
run = "deno bench nearestValue.bench.ts"
[tasks.check]
run = "deno check nearestValue.ts nearestValue.test.ts nearestValue.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
