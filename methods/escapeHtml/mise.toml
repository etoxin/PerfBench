[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test escapeHtml.test.ts"
[tasks.bench]
run = "deno bench escapeHtml.bench.ts"
[tasks.check]
run = "deno check escapeHtml.ts escapeHtml.test.ts escapeHtml.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
