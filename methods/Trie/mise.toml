[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test Trie.test.ts"
[tasks.bench]
run = "deno bench Trie.bench.ts"
[tasks.check]
run = "deno check Trie.ts Trie.test.ts Trie.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
