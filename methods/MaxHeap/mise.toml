[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test MaxHeap.test.ts"
[tasks.bench]
run = "deno bench MaxHeap.bench.ts"
[tasks.check]
run = "deno check MaxHeap.ts MaxHeap.test.ts MaxHeap.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
