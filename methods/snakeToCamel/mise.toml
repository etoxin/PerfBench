[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test snakeToCamel.test.ts"
[tasks.bench]
run = "deno bench snakeToCamel.bench.ts"
[tasks.check]
run = "deno check snakeToCamel.ts snakeToCamel.test.ts snakeToCamel.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
