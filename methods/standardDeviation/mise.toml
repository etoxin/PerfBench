[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test standardDeviation.test.ts"
[tasks.bench]
run = "deno bench standardDeviation.bench.ts"
[tasks.check]
run = "deno check standardDeviation.ts standardDeviation.test.ts standardDeviation.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
