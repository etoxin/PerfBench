[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test mean.test.ts"
[tasks.bench]
run = "deno bench mean.bench.ts"
[tasks.check]
run = "deno check mean.ts mean.test.ts mean.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
