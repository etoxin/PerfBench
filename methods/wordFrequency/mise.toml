[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test wordFrequency.test.ts"
[tasks.bench]
run = "deno bench wordFrequency.bench.ts"
[tasks.check]
run = "deno check wordFrequency.ts wordFrequency.test.ts wordFrequency.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
