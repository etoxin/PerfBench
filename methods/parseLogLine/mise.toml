[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test parseLogLine.test.ts"
[tasks.bench]
run = "deno bench parseLogLine.bench.ts"
[tasks.check]
run = "deno check parseLogLine.ts parseLogLine.test.ts parseLogLine.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
