[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test parseCSVRow.test.ts"
[tasks.bench]
run = "deno bench parseCSVRow.bench.ts"
[tasks.check]
run = "deno check parseCSVRow.ts parseCSVRow.test.ts parseCSVRow.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
