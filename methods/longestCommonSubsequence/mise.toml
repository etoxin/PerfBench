[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test longestCommonSubsequence.test.ts"
[tasks.bench]
run = "deno bench longestCommonSubsequence.bench.ts"
[tasks.check]
run = "deno check longestCommonSubsequence.ts longestCommonSubsequence.test.ts longestCommonSubsequence.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
