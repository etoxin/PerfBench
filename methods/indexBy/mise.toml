[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the indexBy tests"
run = "deno test indexBy.test.ts"

[tasks.bench]
description = "Benchmark indexBy"
run = "deno bench indexBy.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check indexBy.ts indexBy.test.ts indexBy.bench.ts"

[tasks.lint]
description = "Lint the indexBy sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the indexBy sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
