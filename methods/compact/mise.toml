[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the compact tests"
run = "deno test compact.test.ts"

[tasks.bench]
description = "Benchmark compact"
run = "deno bench compact.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check compact.ts compact.test.ts compact.bench.ts"

[tasks.lint]
description = "Lint the compact sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the compact sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
