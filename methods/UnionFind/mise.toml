[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test UnionFind.test.ts"
[tasks.bench]
run = "deno bench UnionFind.bench.ts"
[tasks.check]
run = "deno check UnionFind.ts UnionFind.test.ts UnionFind.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
