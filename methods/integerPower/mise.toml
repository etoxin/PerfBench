[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test integerPower.test.ts"
[tasks.bench]
run = "deno bench integerPower.bench.ts"
[tasks.check]
run = "deno check integerPower.ts integerPower.test.ts integerPower.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
