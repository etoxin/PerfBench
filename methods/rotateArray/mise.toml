[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the rotateArray tests"
run = "deno test rotateArray.test.ts"

[tasks.bench]
description = "Benchmark rotateArray"
run = "deno bench rotateArray.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check rotateArray.ts rotateArray.test.ts rotateArray.bench.ts"

[tasks.lint]
description = "Lint the rotateArray sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the rotateArray sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
