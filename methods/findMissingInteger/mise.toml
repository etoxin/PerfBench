[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test findMissingInteger.test.ts"
[tasks.bench]
run = "deno bench findMissingInteger.bench.ts"
[tasks.check]
run = "deno check findMissingInteger.ts findMissingInteger.test.ts findMissingInteger.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
