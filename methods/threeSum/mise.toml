[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test threeSum.test.ts"
[tasks.bench]
run = "deno bench threeSum.bench.ts"
[tasks.check]
run = "deno check threeSum.ts threeSum.test.ts threeSum.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
