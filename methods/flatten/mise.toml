[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the flatten tests"
run = "deno test flatten.test.ts"

[tasks.bench]
description = "Benchmark flatten"
run = "deno bench flatten.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check flatten.ts flatten.test.ts flatten.bench.ts"

[tasks.lint]
description = "Lint the flatten sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the flatten sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
