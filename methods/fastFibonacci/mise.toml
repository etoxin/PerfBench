[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test fastFibonacci.test.ts"
[tasks.bench]
run = "deno bench fastFibonacci.bench.ts"
[tasks.check]
run = "deno check fastFibonacci.ts fastFibonacci.test.ts fastFibonacci.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
