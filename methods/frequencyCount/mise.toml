[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the frequencyCount tests"
run = "deno test frequencyCount.test.ts"

[tasks.bench]
description = "Benchmark frequencyCount"
run = "deno bench frequencyCount.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check frequencyCount.ts frequencyCount.test.ts frequencyCount.bench.ts"

[tasks.lint]
description = "Lint the frequencyCount sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the frequencyCount sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
