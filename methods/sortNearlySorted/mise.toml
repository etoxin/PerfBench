[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test sortNearlySorted.test.ts"
[tasks.bench]
run = "deno bench sortNearlySorted.bench.ts"
[tasks.check]
run = "deno check sortNearlySorted.ts sortNearlySorted.test.ts sortNearlySorted.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
