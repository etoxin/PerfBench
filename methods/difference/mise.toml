[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the difference tests"
run = "deno test difference.test.ts"

[tasks.bench]
description = "Benchmark difference"
run = "deno bench difference.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check difference.ts difference.test.ts difference.bench.ts"

[tasks.lint]
description = "Lint the difference sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the difference sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
