[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test slugify.test.ts"
[tasks.bench]
run = "deno bench slugify.bench.ts"
[tasks.check]
run = "deno check slugify.ts slugify.test.ts slugify.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
