[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test unescapeHtml.test.ts"
[tasks.bench]
run = "deno bench unescapeHtml.bench.ts"
[tasks.check]
run = "deno check unescapeHtml.ts unescapeHtml.test.ts unescapeHtml.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
