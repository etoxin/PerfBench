[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test insertionSort.test.ts"
[tasks.bench]
run = "deno bench insertionSort.bench.ts"
[tasks.check]
run = "deno check insertionSort.ts insertionSort.test.ts insertionSort.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
