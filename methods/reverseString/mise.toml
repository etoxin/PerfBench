[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test reverseString.test.ts"
[tasks.bench]
run = "deno bench reverseString.bench.ts"
[tasks.check]
run = "deno check reverseString.ts reverseString.test.ts reverseString.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
