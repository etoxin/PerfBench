[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test BloomFilter.test.ts"
[tasks.bench]
run = "deno bench BloomFilter.bench.ts"
[tasks.check]
run = "deno check BloomFilter.ts BloomFilter.test.ts BloomFilter.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
