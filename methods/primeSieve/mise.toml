[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test primeSieve.test.ts"
[tasks.bench]
run = "deno bench primeSieve.bench.ts"
[tasks.check]
run = "deno check primeSieve.ts primeSieve.test.ts primeSieve.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
