[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test isPalindrome.test.ts"
[tasks.bench]
run = "deno bench isPalindrome.bench.ts"
[tasks.check]
run = "deno check isPalindrome.ts isPalindrome.test.ts isPalindrome.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
