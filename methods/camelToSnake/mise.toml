[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test camelToSnake.test.ts"
[tasks.bench]
run = "deno bench camelToSnake.bench.ts"
[tasks.check]
run = "deno check camelToSnake.ts camelToSnake.test.ts camelToSnake.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
