[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the intersection tests"
run = "deno test intersection.test.ts"

[tasks.bench]
description = "Benchmark intersection"
run = "deno bench intersection.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check intersection.ts intersection.test.ts intersection.bench.ts"

[tasks.lint]
description = "Lint the intersection sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the intersection sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
