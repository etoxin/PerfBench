[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test longestSubstringWithoutRepeating.test.ts"
[tasks.bench]
run = "deno bench longestSubstringWithoutRepeating.bench.ts"
[tasks.check]
run = "deno check longestSubstringWithoutRepeating.ts longestSubstringWithoutRepeating.test.ts longestSubstringWithoutRepeating.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
