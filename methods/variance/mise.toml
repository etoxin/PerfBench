[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test variance.test.ts"
[tasks.bench]
run = "deno bench variance.bench.ts"
[tasks.check]
run = "deno check variance.ts variance.test.ts variance.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
