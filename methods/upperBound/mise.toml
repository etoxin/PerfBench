[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test upperBound.test.ts"
[tasks.bench]
run = "deno bench upperBound.bench.ts"
[tasks.check]
run = "deno check upperBound.ts upperBound.test.ts upperBound.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
