[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test histogram.test.ts"
[tasks.bench]
run = "deno bench histogram.bench.ts"
[tasks.check]
run = "deno check histogram.ts histogram.test.ts histogram.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
