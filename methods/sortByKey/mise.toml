[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test sortByKey.test.ts"
[tasks.bench]
run = "deno bench sortByKey.bench.ts"
[tasks.check]
run = "deno check sortByKey.ts sortByKey.test.ts sortByKey.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
