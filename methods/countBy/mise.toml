[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the countBy tests"
run = "deno test countBy.test.ts"

[tasks.bench]
description = "Benchmark countBy"
run = "deno bench countBy.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check countBy.ts countBy.test.ts countBy.bench.ts"

[tasks.lint]
description = "Lint the countBy sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the countBy sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
