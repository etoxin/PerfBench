[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test findDuplicate.test.ts"
[tasks.bench]
run = "deno bench findDuplicate.bench.ts"
[tasks.check]
run = "deno check findDuplicate.ts findDuplicate.test.ts findDuplicate.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
