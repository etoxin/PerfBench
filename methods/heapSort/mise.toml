[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test heapSort.test.ts"
[tasks.bench]
run = "deno bench heapSort.bench.ts"
[tasks.check]
run = "deno check heapSort.ts heapSort.test.ts heapSort.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
