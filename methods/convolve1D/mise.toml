[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test convolve1D.test.ts"
[tasks.bench]
run = "deno bench convolve1D.bench.ts"
[tasks.check]
run = "deno check convolve1D.ts convolve1D.test.ts convolve1D.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
