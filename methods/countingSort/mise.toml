[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test countingSort.test.ts"
[tasks.bench]
run = "deno bench countingSort.bench.ts"
[tasks.check]
run = "deno check countingSort.ts countingSort.test.ts countingSort.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
