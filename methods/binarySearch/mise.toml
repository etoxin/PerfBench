[tools]
deno = "2.9.4"

[tasks.test]
run = "deno test binarySearch.test.ts"
[tasks.bench]
run = "deno bench binarySearch.bench.ts"
[tasks.check]
run = "deno check binarySearch.ts binarySearch.test.ts binarySearch.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
