[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the chunk tests"
run = "deno test chunk.test.ts"

[tasks.bench]
description = "Benchmark chunk"
run = "deno bench chunk.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check chunk.ts chunk.test.ts chunk.bench.ts"

[tasks.lint]
description = "Lint the chunk sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the chunk sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
