[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the groupBy tests"
run = "deno test groupBy.test.ts"

[tasks.bench]
description = "Benchmark groupBy"
run = "deno bench groupBy.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check groupBy.ts groupBy.test.ts groupBy.bench.ts"

[tasks.lint]
description = "Lint the groupBy sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the groupBy sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
