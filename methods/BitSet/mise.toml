[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test BitSet.test.ts"
[tasks.bench]
run = "deno bench BitSet.bench.ts"
[tasks.check]
run = "deno check BitSet.ts BitSet.test.ts BitSet.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
