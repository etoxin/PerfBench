[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the unzip tests"
run = "deno test unzip.test.ts"

[tasks.bench]
description = "Benchmark unzip"
run = "deno bench unzip.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check unzip.ts unzip.test.ts unzip.bench.ts"

[tasks.lint]
description = "Lint the unzip sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the unzip sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
