[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test substringSearch.test.ts"
[tasks.bench]
run = "deno bench substringSearch.bench.ts"
[tasks.check]
run = "deno check substringSearch.ts substringSearch.test.ts substringSearch.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
