[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test replaceAllOccurrences.test.ts"
[tasks.bench]
run = "deno bench replaceAllOccurrences.bench.ts"
[tasks.check]
run = "deno check replaceAllOccurrences.ts replaceAllOccurrences.test.ts replaceAllOccurrences.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
