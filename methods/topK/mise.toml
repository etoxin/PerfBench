[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the topK tests"
run = "deno test topK.test.ts"

[tasks.bench]
description = "Benchmark topK"
run = "deno bench topK.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check topK.ts topK.test.ts topK.bench.ts"

[tasks.lint]
description = "Lint the topK sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the topK sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
