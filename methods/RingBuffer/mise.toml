[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test RingBuffer.test.ts"
[tasks.bench]
run = "deno bench RingBuffer.bench.ts"
[tasks.check]
run = "deno check RingBuffer.ts RingBuffer.test.ts RingBuffer.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
