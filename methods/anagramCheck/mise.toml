[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test anagramCheck.test.ts"
[tasks.bench]
run = "deno bench anagramCheck.bench.ts"
[tasks.check]
run = "deno check anagramCheck.ts anagramCheck.test.ts anagramCheck.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
