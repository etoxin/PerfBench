[tools]
deno = "2.9.4"

[tasks.test]
description = "Run the maxBy tests"
run = "deno test maxBy.test.ts"

[tasks.bench]
description = "Benchmark maxBy"
run = "deno bench maxBy.bench.ts"

[tasks.check]
description = "Type-check the implementation, tests, and benchmark"
run = "deno check maxBy.ts maxBy.test.ts maxBy.bench.ts"

[tasks.lint]
description = "Lint the maxBy sources"
run = "deno lint ."

[tasks.fmt]
description = "Format the maxBy sources"
run = "deno fmt ."

[tasks."fmt-check"]
description = "Check source formatting without changing files"
run = "deno fmt --check ."

[tasks.verify]
description = "Run all non-mutating validation tasks"
depends = ["fmt-check", "lint", "check", "test"]
