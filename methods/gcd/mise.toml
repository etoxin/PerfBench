[tools]
deno = "2.9.4"
[tasks.test]
run = "deno test gcd.test.ts"
[tasks.bench]
run = "deno bench gcd.bench.ts"
[tasks.check]
run = "deno check gcd.ts gcd.test.ts gcd.bench.ts"
[tasks.lint]
run = "deno lint ."
[tasks.fmt]
run = "deno fmt ."
[tasks."fmt-check"]
run = "deno fmt --check ."
[tasks.verify]
depends = ["fmt-check", "lint", "check", "test"]
